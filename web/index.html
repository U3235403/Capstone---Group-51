<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f6f52">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="pwa.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Private, offline household shopping lists.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stage 1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stage 1</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" role="status"><h1>Stage 1</h1><p>Opening your shopping list…</p><noscript>Enable JavaScript to use this app.</noscript></div>
  <dialog id="install-panel" aria-labelledby="install-title" hidden>
    <h2 id="install-title"></h2><p id="install-message"></p>
    <p id="offline-status" role="status">Preparing offline access…</p>
    <div class="install-actions"><button id="install-action" type="button">Install app</button><button id="install-close" type="button">Not now</button></div>
  </dialog>
  <script src="pwa.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="pilot.js"></script>
  <script src="local_services.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
